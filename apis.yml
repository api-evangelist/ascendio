name: Ascend.io
description: >-
  Ascend.io is a data engineering platform for building declarative, DataAware data pipelines
  that unify ingestion, transformation, and orchestration across warehouses like BigQuery,
  Snowflake, Databricks, and MotherDuck. Pipelines are authored in SQL, Python, and YAML and
  operated through Otto, Ascend's agentic AI assistant. Its developer surface is the Ascend
  Instance web API (/api/v1, service-account Bearer auth) exposed through the ascend-tools CLI,
  first-party Python/JavaScript/Rust SDKs, and an official 25-tool MCP server. Ascend announced
  in 2026 that it is winding down operations; the open-source tooling and documentation remain
  published at capture time. Added to the API Evangelist network as an Accel portfolio company.
